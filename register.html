<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css"> 
    <style>
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-in-out; 
        }

        
        .modal-content {
            background-color: rgba(255, 255, 255, 0.85); 
            margin: auto;
            padding: 20px;
            border-radius: 15px; 
            width: 17%; 
            max-width: 400px; 
            text-align: center;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
            animation: slideIn 0.5s ease; 
        }

        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        
        .btn-ok {
            background-color: #23ac11;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-ok:hover {
            background-color: #5a3e30;
        }

        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        
        @keyframes slideIn {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form action="data.php" method="POST">
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="successMessage">Registration successful!</p>
            <button class="btn-ok" id="btnSuccess">OK</button>
        </div>
    </div>

   
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="errorMessage">Error</p>
            <button class="btn-ok" id="btnError">OK</button>
        </div>
    </div>

    <script>
        
        var successModal = document.getElementById('successModal');
        var errorModal = document.getElementById('errorModal');

        
        var closeButtons = document.getElementsByClassName("close");

        
        document.getElementById("btnSuccess").onclick = function () {
            window.location.href = 'login.html';
        };

        
        document.getElementById("btnError").onclick = function () {
            window.location.href = 'register.html';
        };

        
        for (var i = 0; i < closeButtons.length; i++) {
            closeButtons[i].onclick = function () {
                this.parentElement.parentElement.style.display = 'none';
            };
        }

        
        window.onclick = function (event) {
            if (event.target == successModal) {
                successModal.style.display = 'none';
            }
            if (event.target == errorModal) {
                errorModal.style.display = 'none';
            }
        }

        
        const urlParams = new URLSearchParams(window.location.search);
        const popupMessage = urlParams.get('popupMessage');
        const popupType = urlParams.get('popupType');

        if (popupType === 'success') {
            document.getElementById('successMessage').innerText = popupMessage;
            successModal.style.display = 'block';
        } else if (popupType === 'error') {
            document.getElementById('errorMessage').innerText = popupMessage;
            errorModal.style.display = 'block';
        }
    </script>
</body>
</html>
